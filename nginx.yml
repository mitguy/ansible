---
- name: Install and configure Nginx
  hosts: web
  become: true
  tasks:
    - name: Install Nginx package
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Ensure Nginx is started and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
    - name: Deploy index.html v2
      ansible.builtin.copy:
        content: "<h1>Hello from Ansible! Host: {{ inventory_hostname }}</h1>\n<h2>Newly added line</h2>\n"
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
    - name: Hide Nginx version in HTTP headers
      ansible.builtin.copy:
        content: "server_tokens off;\n"
        dest: /etc/nginx/conf.d/security.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
