---
# ---------- install ----------
- name: Install Nginx package
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [install]

- name: Ensure Nginx is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  tags: [install]

# ---------- config ----------
- name: Create document root for each site
  ansible.builtin.file:
    path: "{{ nginx_site.root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: nginx_site
    label: "{{ nginx_site.name }}"
  tags: [config]

- name: Deploy index.html for each site
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_site.root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: nginx_site
    label: "{{ nginx_site.name }}"
  tags: [config]

- name: Deploy site config to sites-available
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: nginx_site
    label: "{{ nginx_site.name }}"
  notify: Nginx config changed
  tags: [config]

- name: Enable sites (symlinks in sites-enabled)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site.name }}.conf"
    state: link
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: nginx_site
    label: "{{ nginx_site.name }}"
  notify: Nginx config changed
  tags: [config]

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: nginx_disable_default
  notify: Nginx config changed
  tags: [config]
